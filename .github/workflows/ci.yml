name: AS3500 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install plugin and tests
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Validate code
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Numerical and integration tests
        run: python -m pytest -q
